version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: aistor-server
    command: minio server /mnt/minio --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /home/kourosh/minio:/mnt/minio
    restart: always
    tty: true
    stdin_open: true
